name: web-protocol-experiment

services:
  app:
    build:
      context: ./app
    init: true
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 15
    restart: "no"

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8441:8441"
      - "127.0.0.1:8442:8442"
      - "127.0.0.1:8443:8443/tcp"
      - "127.0.0.1:8443:8443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: "no"
